name: Tests
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: tts-bridge
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: tts-bridge/packaging/node-version
          cache: npm
          cache-dependency-path: |
            tts-bridge/package-lock.json
            tts-bridge/discord/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm --prefix discord ci --no-audit --no-fund
      - name: Check formatting
        run: npm run format:check
      - run: npm test
      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium
      - name: Browser tests
        run: npm run test:browser
      - uses: actions/upload-artifact@v7.0.2
        if: failure()
        with:
          name: playwright-report
          path: |
            tts-bridge/test-results/
            tts-bridge/playwright-report/
          retention-days: 7
