<!doctype html>
<html lang="ja">
  <meta charset="utf-8" /><meta
    name="viewport"
    content="width=device-width,initial-scale=1"
  /><title>卓の音声 | TRPG Voice Bridge</title
  ><link rel="stylesheet" href="/web/style.css" />
  <main class="player">
    <p class="eyebrow">TRPG VOICE BRIDGE</p>
    <h1>物語に、声を。</h1>
    <p>音声を有効にすると、この卓の新しいセリフが順番に流れます。</p>
    <p id="status" role="status">接続しています…</p>
    <button id="enable">音声を有効にする</button
    ><button id="latest" class="secondary">最新へ戻る</button
    ><label
      >音量
      <input id="volume" type="range" min="0" max="1" step="0.01" value="0.8"
    /></label>
    <h2 id="speaker">次の発言を待っています</h2>
    <p id="caption"></p>
    <details>
      <summary>キャラクター別ミュート</summary>
      <div id="mutes"></div>
    </details>
    <p class="muted">
      画面ロックや長い中断の後は、再開ボタンを押してください。
    </p>
    <section>
      <h2>セリフのログ</h2>
      <p class="muted">
        直近10分のセリフは「もう一度再生」で、自分だけもう一度聞けます。
      </p>
      <ol id="log" class="log"></ol>
    </section>
    <section>
      <h2>キャラの声</h2>
      <p>全員で設定できます。声が未設定のキャラから表示します。</p>
      <p id="characterStatus" role="status"></p>
      <div id="characters"></div>
    </section>
  </main>
  <dialog id="characterEditor">
    <form id="characterForm">
      <h2>キャラの声を設定</h2>
      <label
        >キャラ名<input name="displayName" required maxlength="200"
      /></label>
      <label
        ><input name="enabled" type="checkbox" />このキャラを読み上げる</label
      >
      <label>声を選ぶ<select name="voice"></select></label>
      <p id="voiceUsers"></p>
      <label>声の名前<input name="name" required maxlength="200" /></label>
      <label
        >参照音声<input
          name="voiceId"
          list="referenceVoices"
          required /><datalist id="referenceVoices"></datalist
      ></label>
      <label
        >声の説明（caption）<textarea
          name="caption"
          maxlength="1000"
        ></textarea>
      </label>
      <label
        >話す速度<input
          name="speed"
          type="number"
          min="0.5"
          max="2"
          step="0.05"
          required
      /></label>
      <details>
        <summary>声の詳細設定</summary>
        <label>seed<input name="seed" pattern="[0-9]{1,19}" required /></label>
        <label
          >生成ステップ数<input
            name="steps"
            type="number"
            min="1"
            max="100"
            required
        /></label>
        <label
          >テキストCFG<input
            name="cfgScaleText"
            type="number"
            min="0"
            max="10"
            step="0.1"
        /></label>
        <label
          >説明CFG<input
            name="cfgScaleCaption"
            type="number"
            min="0"
            max="10"
            step="0.1"
        /></label>
        <label
          >参照音声CFG<input
            name="cfgScaleSpeaker"
            type="number"
            min="0"
            max="10"
            step="0.1"
        /></label>
      </details>
      <label
        >試聴するセリフ<input
          name="sample"
          value="こんにちは。よろしくお願いします。"
          maxlength="500"
      /></label>
      <button type="button" id="previewVoice">自分だけで試聴</button>
      <audio id="previewAudio" controls></audio>
      <div id="referenceRegister" hidden>
        <label
          >参照音声ID（英数字・_・-）<input
            name="referenceId"
            maxlength="64"
            autocomplete="off"
        /></label>
        <button type="button" id="registerReference" class="secondary">
          この試聴音声を参照音声に登録
        </button>
      </div>
      <p id="editorStatus" role="status"></p>
      <button id="saveCharacter">保存</button
      ><button type="button" id="cancelCharacter" class="secondary">
        キャンセル
      </button>
    </form>
  </dialog>
  <script type="module" src="/web/player.js"></script>
</html>
