<!doctype html>
<html lang="ja">
  <meta charset="utf-8" /><meta
    name="viewport"
    content="width=device-width,initial-scale=1"
  />
  <title>管理 | TRPG Voice Bridge</title
  ><link rel="stylesheet" href="/web/style.css" />
  <main>
    <p class="eyebrow">TRPG VOICE BRIDGE</p>
    <h1>卓の音声を管理</h1>
    <p id="notice" role="status"></p>
    <section>
      <h2>接続状態</h2>
      <p id="connection">確認しています…</p>
      <div id="collectors"></div>
      <p id="participants"></p>
      <button id="toggle" disabled>読み上げ開始</button>
      <button id="copyInvite">参加URLをコピー</button>
      <button id="openPlayer">Playerを開く</button>
      <p id="invite" class="muted"></p>
      <p>キャラの声はPlayerで全員が設定できます。</p>
    </section>
    <section id="pairingSection" hidden>
      <h2>Collectorの初回接続を承認</h2>
      <p>拡張機能に表示された確認コードと一致する接続を承認してください。</p>
      <div id="pairings"></div>
    </section>
    <section id="recovery" hidden>
      <h2>音声生成の確認が必要です</h2>
      <p id="failure"></p>
      <button id="recover">Irodori側の処理終了を確認して復帰</button>
    </section>
    <details>
      <summary>詳細設定</summary>
      <section>
        <h2>Irodori接続先</h2>
        <form id="providerForm">
          <label>接続先URL<input id="providerUrl" type="url" required /></label
          ><button>接続先を保存</button
          ><button type="button" id="testConnection">接続テスト</button>
        </form>
      </section>
      <section>
        <h2>Playerの表示</h2>
        <label
          ><input
            id="publishText"
            type="checkbox"
          />Playerにセリフの本文を表示する</label
        >
        <p class="muted">
          オフにすると、Playerのログには話者名だけを表示します。次のセリフから反映します。
        </p>
      </section>
      <section>
        <h2>接続・セッション</h2>
        <button id="renewInvite">参加URLを再発行</button>
        <button id="releaseCollector">Collectorの接続を解除</button>
        <button id="revokeCollectors">Collectorの承認を取り消す</button>
        <button id="endSession" class="danger">セッション終了</button>
      </section>
      <section>
        <h2>初期化</h2>
        <p>
          キャラ・声・紐付けをconfigの初期値へ戻します。認証情報と接続設定は残ります。
        </p>
        <button id="resetSettings" class="danger">設定を初期値に戻す</button>
      </section>
    </details>
  </main>
  <script type="module" src="/web/admin.js"></script>
</html>
