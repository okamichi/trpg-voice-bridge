<!doctype html>
<html lang="ja">
  <meta charset="utf-8" /><title>TRPG Voice Collector</title
  ><link rel="stylesheet" href="popup.css" />
  <h1>卓のチャットを接続</h1>
  <p id="detected">現在のタブを確認しています…</p>
  <form id="settings">
    <label id="roomField" hidden
      >部屋の識別名<input
        name="contextId"
        placeholder="卓ごとに同じ名前を使ってください"
    /></label>
    <label id="channelField" hidden>対象チャット<input name="channel" /></label>
    <details>
      <summary>Bridge接続先</summary>
      <label
        >Bridge URL<input name="bridge" value="http://127.0.0.1:8090" required
      /></label>
    </details>
    <p>ユドナリウムでは読み上げたい公開チャットを表示してください。</p>
    <button id="connect">このタブを接続</button
    ><button type="button" id="stop">取得を停止</button>
  </form>
  <p id="status" role="status"></p>
  <script src="popup.js"></script>
</html>
